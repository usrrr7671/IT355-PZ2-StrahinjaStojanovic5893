# Konfiguracija koja vazi samo tokom testiranja.
#
# Baza je u memoriji i pravi se iznova za svaki pokretanje konteksta, pa testovi
# ne diraju razvojnu H2 datoteku i ne zavise od podataka koji su u njoj ostali.
spring:
  datasource:
    url: jdbc:h2:mem:helpdesk-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-tajni-kljuc-za-potpisivanje-tokena-u-testovima-it355-2026
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
